[package]
name = "guide-optimizer"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Research tooling for Slice B: optimises the pack-authoring guide with a copied GEPA engine. Not part of lesscode-core."
license = "MIT"

# Standalone: not a member of any workspace and not a dependency of the product crate.
[workspace]

[dependencies]
dsrust-gepa = { path = "vendor/dsrust-gepa" }
dsrust-tpe = { path = "vendor/dsrust-tpe" }
lesscode-core = { path = "../../native" }
# The same version as lesscode-core, for the grammar's node kind names.
ast-grep-core = "=0.51.0"
serde_json = "=1.0.154"
clap = { version = "=4.6.0", features = ["derive"] }
