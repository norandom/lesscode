[package]
name = "lesscode-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "The model seam of lesscode: the only place that talks to a model service"
license = "MIT"

# Standalone: its own lock file. The core never links this crate; it starts
# the executable (spec model-seam, design: Allowed Dependencies).
[workspace]

[dependencies]
lesscode-core = { path = "../native" }
# The client library; one adapter per request style, no rule of ours per vendor.
genai = "=0.7.4"
tokio = { version = "=1.54.1", features = ["rt", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
