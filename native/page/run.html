:root[data-theme="dark"] {

* { box-sizing: border-box; }

.mark { width: 14px; flex: none; text-align: center; font-weight: 700; }
.mark.ok { color: var(--ok); } .mark.warn { color: var(--warn); } .mark.bad { color: var(--bad); } .mark.off { color: var(--off); }
.d1 { padding-left: 20px; } .d2 { padding-left: 54px; cursor: default; }
.fold { width: 10px; flex: none; color: var(--quiet); }
.pane { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); background: var(--panel); }

.body { overflow: auto; padding: 12px 14px 24px; min-width: 0; }
.body h2 { font-size: 15px; margin: 0 0 6px; } .body h3 { font-size: 13px; margin: 14px 0 4px; }

table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--quiet); font-weight: 500; } td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.wide { overflow-x: auto; }
/* The two drawings of the report: functions and calls on a rim, and the shapes of a type's state. */
.bowls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 10px; max-width: 900px; }
.bowl { margin: 0; min-width: 0; } .bowl svg { display: block; width: 100%; height: auto; } .bowl figcaption { color: var(--quiet); }
.rim { fill: none; stroke: var(--line); } .fn { fill: var(--ink); } .bowl text { font: 9px var(--ui); fill: var(--quiet); }

.body h4 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }

.cell.part { border-style: solid; border-color: var(--warn); } .cell.on { border-style: solid; border-color: var(--ok); background: var(--ok-bg); color: var(--ink); }

.head .ask { font-weight: 600; }
.lead { font-size: 14px; }
.body details { max-width: 74ch; border-top: 1px solid var(--line); }
.body summary { cursor: pointer; padding: 5px 0; font-weight: 600; }

.lane li + li::before { content: ""; flex: none; align-self: center; width: 14px; height: 1px; background: var(--off); margin: 0 3px; }
.stop { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; text-align: left; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 4px 8px; cursor: pointer; }

.grp .name { font-weight: 600; } .body ul.todo { list-style: none; padding: 0; } .todo li { border-left: 3px solid var(--line); padding: 1px 0 1px 8px; margin: 0 0 5px; }

.notice details { margin-top: 2px; } .notice summary { cursor: pointer; color: var(--quiet); } .raw { margin: 4px 0 2px; padding: 6px 8px; max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; font: 12px/1.4 var(--mono); }

.body ol.how { list-style: none; counter-reset: how; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; padding: 0; margin: 0 0 10px; max-width: 900px; }
.how li { counter-increment: how; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 6px 8px; }
.how b { display: block; font-weight: 600; } .how b::before { content: counter(how) ". "; color: var(--focus); } .how span { color: var(--quiet); }

.body ul.tiles { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding: 0; margin: 0 0 10px; max-width: 900px; }
.tile { border: 1px solid var(--line); border-left: 4px solid var(--off); border-radius: 4px; background: var(--panel); padding: 5px 8px; }
.tile.ok { border-left-color: var(--ok); } .tile.warn { border-left-color: var(--warn); }
.tile b, .tile span { display: block; } .tile span { color: var(--quiet); } .tile .verd { color: var(--ink); font-weight: 600; } .tile .num { color: var(--ink); }
.foot { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 3px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--quiet); font-size: 12px; }
.big { padding: 40px 20px; max-width: 70ch; margin: 0 auto; }
@media (max-width: 640px) { .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(120px, 38%) minmax(0, 1fr); } .tree { border-right: 0; border-bottom: 1px solid var(--line); } }

      var known = cells.filter(function (c) { return typeof c[key] === 'boolean'; });
      return known.length ? show(known.filter(function (c) { return c[key]; }).length) + (known.length < cells.length ? ' of the ' + show(known.length) + ' that were looked at' : '') : 'not measured';
    };
    var word = function (v, yes, no, none) { return v === true ? yes : v === false ? no : none; };
    return html`<h4><code>${text(t.type)}</code>${side}</h4>
      <p>Can be written: ${show(cells.length)}. Reached by the code: ${count('reached')}. Seen by the tests: ${count('seen')}.</p>
      <ul class="cells">${cells.slice(0, 256).map(function (c) { return html`<li class=${'cell' + (c.reached === true ? (c.seen === true ? ' on' : ' part') : '')}><b>${text(c.shape)}</b>
        <span>${word(c.reached, 'reached by the code', 'never reached', 'reached: not measured')}</span><span>${word(c.seen, 'seen by the tests', 'seen by no test', 'seen: not measured')}</span></li>`; })}</ul>
      ${cells.length > 256 ? html`<p>${cells.length - 256} more shapes are not shown.</p>` : ''}
      <p>Counted by <code>${text(t.command)}</code>, handed in, not measured by this run.</p>`;
  }
  // The faults of a run on one state of the code, counted by what the tests made of them.
  function Counted(p) {
    var s = p.s, f = s.faults || {};
    return html`<dt>Faults planted</dt><dd>${show(f.total)}</dd><dt>Noticed</dt><dd>${show(f.noticed)}</dd><dt>Unnoticed</dt><dd>${show(f.unnoticed)}</dd><dt>Did not build</dt><dd>${show(f.not_built)}</dd>${n(f.not_compiled_here) ? html`<dt>In code not built on this system</dt><dd>${show(f.not_compiled_here)}, counted in no line above; they tell nothing</dd>` : ''}<dt>Time</dt><dd>${span(n(s.seconds))}</dd><dt>Exit code</dt><dd>${show(s.exit_code)}</dd>`;
  }

  // Why the tool says a copy or a stage stopped: its sentence, and what a command printed last behind a line that opens.
  function Raw(p) {
    if (!(typeof p.of === 'string' && p.of)) return html` The tool gave no reason.`;
    // The tool's sentence is its first line; the end of what the command printed follows it.
    var cut = p.of.indexOf('\n'), first = cut < 0 ? p.of : p.of.slice(0, cut), rest = cut < 0 ? '' : p.of.slice(cut + 1);
    if (!rest && first.length > 240) { rest = first; first = ''; }
    return html`${first ? html` <span>The tool says: ${first}.</span>` : ''}${rest ? html`<details><summary>What the tool recorded</summary><div class="raw">${rest}</div></details>` : ''}`;
  }

  function Run(p) {
    var s = p.s, state = p.state, f = s.faults || {}, stages = things(s.stages);
    var going = stages.filter(function (x) { return x.status === 'going on'; })[0];
    // A file's functions are hidden when all are shut and it was not opened, or when it was shut alone.
    var st = useState({ tab: 'now', follow: true, picked: null, shut: false, flipped: {}, groups: {}, noticed: true, unnoticed: true, notbuilt: true, byUnnoticed: true, copied: false });
    var ui = st[0], set = function (change) { st[1](Object.assign({}, ui, change)); };
    var current = ui.follow || !ui.picked ? (going || stages[stages.length - 1]) : stages.filter(function (x) { return x.id === ui.picked; })[0];
    // Once the run has ended the page stands at its result, unless a step was picked.
    var atResult = state === 'ended' && !(ui.picked && !ui.follow);
    var folded = function (key) { return ui.shut !== (ui.flipped[key] === true); };
    var flip = function (key) { var next = Object.assign({}, ui.flipped); next[key] = !next[key]; set({ flipped: next }); };
    var over = state === 'ended' || state === 'stopped';
    var total = n(f.total) || 0, part = function (x) { return total ? Math.max(0, (n(x) || 0) / total * 100) + '%' : '0%'; };
    var files = things(f.files), fns = things(f.functions);
    if (ui.byUnnoticed) { files.sort(function (a, b) { return (n(b.unnoticed) || 0) - (n(a.unnoticed) || 0); }); fns.sort(function (a, b) { return (n(b.unnoticed) || 0) - (n(a.unnoticed) || 0); }); }
    var counts = function (x) { if (standing(x) === 'not begun') return show(x.left) + (over ? ' not run' : ' to run'); return [ui.noticed && show(x.noticed) + ' noticed', ui.unnoticed && show(x.unnoticed) + ' unnoticed', ui.notbuilt && n(x.not_built) ? show(x.not_built) + ' not built' : null, n(x.not_compiled_here) ? show(x.not_compiled_here) + ' not built here' : null].filter(Boolean).join(' · '); };
    // At its end the run is named by its outcome, in the colour the result has.
    var refusedRun = s.report !== null && typeof s.report === 'object' && s.report.refusal;
    var pill = { running: ['warn', 'Running'], quiet: ['warn', 'Quiet'], stopped: ['bad', 'The tool stopped'], ended: [s.exit_code === 0 ? 'ok' : refusedRun ? 'bad' : 'warn', text(s.outcome, 'Ended')] }[state] || ['off', state];
    // A step of the lane in a few words: how far it is.
    var step = function (x) {
      var k = seenAs(x.status, state);
      return k === 'ended' ? 'done' + (n(x.seconds) !== null ? ' in ' + span(x.seconds) : '') : k === 'going on' ? (n(x.total) ? show(x.done) + ' of ' + show(x.total) + ' done' : 'going on for ' + span(n(x.seconds_so_far))) : k === 'stopped' ? 'the tool stopped here' : k === 'left out' ? 'left out: not run' : k === 'not begun' ? 'not begun yet' : k;
    };
    var ask = typeof s.command === 'string' && Object.prototype.hasOwnProperty.call(ASKS, s.command) ? ASKS[s.command] : '';
    var left = n(f.total) !== null && n(f.done) !== null && !over ? Math.max(0, f.total - f.done) : 0;
    // The marks the tree shows now, and no other, are explained under it.
    var shown = {};
    stages.forEach(function (x) { shown[seenAs(x.status, state)] = true; });
    files.concat(fns).forEach(function (x) { shown[rowAs(x, state)] = true; });
    var dropped = things((s.copies || {}).dropped), tests = s.tests || {};
    var bare = fns.filter(function (x) { return x.unprotected === true && x.side !== 'before'; }).length;
    var copy = function () {
      var d = text((s.copies || {}).directory, ''), no = function () { set({ copied: 'no' }); };
      if (navigator.clipboard && d) navigator.clipboard.writeText(d).then(function () { set({ copied: 'yes' }); }, no); else no();
    };
    // The tabs as one stop for the keyboard: the arrows move between them.
    var pick = function (e) {
      var at = tabs.map(function (t) { return t[0]; }).indexOf(ui.tab), to = { ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      var next = tabs[(to + tabs.length) % tabs.length][0], el = document.getElementById('tab-' + next);
      set({ tab: next });
      if (el) el.focus();
    };
    var tabs = [['now', 'Now'], ['code', 'Your code'], ['faults', 'Planted faults'], ['bare', 'Unprotected' + (bare ? ' (' + bare + ')' : '')], ['result', 'Result']];
    return html`
      <header class="head"><h1>lesscode</h1>${ask ? html`<span class="ask">${ask}</span>` : ''}<span class="what"><code>${text(s.command)}</code> on <code>${text((s.subject || {}).repository)}</code> at <code>${text((s.subject || {}).commit).slice(0, 12)}</code></span><span class=${'pill ' + pill[0]} role="status">${pill[1]}</span></header>
      <${Touches} s=${s} />
      <ol class="lane" aria-label="The steps of this run, in order">
        ${stages.map(function (x, i) { return html`<li><button class="stop" type="button" aria-current=${String(current === x && !atResult)} onClick=${function () { set({ picked: x.id, follow: false, tab: 'now' }); }}>${mark(seenAs(x.status, state))}<span class="t"><b>${i + 1}. ${text(x.title)}</b><span>${step(x)}</span></span></button></li>`; })}
        ${stages.length ? html`<li><button class="stop" type="button" aria-current=${String(ui.tab === 'result' || (ui.tab === 'now' && atResult))} onClick=${function () { set({ tab: 'result' }); }}><span class=${'sign ' + (!s.ended ? 'off' : s.exit_code === 0 ? 'ok' : refusedRun ? 'bad' : 'warn')} aria-hidden="true">${!s.ended ? '·' : s.exit_code === 0 ? '✓' : '!'}</span><span class="t"><b>${stages.length + 1}. Result</b><span>${s.ended ? text(s.outcome, 'the run ended') : 'when the run has ended'}</span></span></button></li>` : ''}
      </ol>
      <div class="tools" role="toolbar" aria-label="View">
        <${Tool} icon="follow" title="Follow the stage that is going on" pressed=${ui.follow} onClick=${function () { set({ follow: !ui.follow, picked: null, tab: 'now' }); }} />
        <span class="sep"></span>
        <${Tool} icon="expand" title="Show the functions of every file" onClick=${function () { var all = {}; stages.forEach(function (x) { all['stage ' + x.id] = true; }); set({ shut: false, flipped: {}, groups: all }); }} />
        <${Tool} icon="collapse" title="Hide the functions of every file" onClick=${function () { set({ shut: true, flipped: {} }); }} />
        <span class="sep"></span>
        <${Tool} icon="noticed" title="Show noticed faults" pressed=${ui.noticed} onClick=${function () { set({ noticed: !ui.noticed }); }} />
        <${Tool} icon="unnoticed" title="Show unnoticed faults" pressed=${ui.unnoticed} onClick=${function () { set({ unnoticed: !ui.unnoticed }); }} />
        <${Tool} icon="notbuilt" title="Show faults that did not build" pressed=${ui.notbuilt} onClick=${function () { set({ notbuilt: !ui.notbuilt }); }} />
        <${Tool} icon="sort" title="Sort by unnoticed faults" pressed=${ui.byUnnoticed} onClick=${function () { set({ byUnnoticed: !ui.byUnnoticed }); }} />
        <span class="sep"></span>
        <${Tool} icon="copy" title="Copy the place of the copies" onClick=${copy} />
        <${Tool} icon="help" title="What a planted fault is" onClick=${function () { set({ tab: 'faults' }); }} />
        <span class="said" role="status">${ui.copied === 'yes' ? 'Copied' : ui.copied === 'no' ? 'Could not copy. The place is in the tab Your code.' : ''}</span>
      </div>
      <div class="bar" role="img" aria-label=${show(f.noticed) + ' noticed, ' + show(f.unnoticed) + ' unnoticed, ' + show(f.not_built) + ' not built, ' + (n(f.not_compiled_here) ? show(f.not_compiled_here) + ' in code not built on this system, ' : '') + 'of ' + show(f.total)}><i class="n" style=${'width:' + part(f.noticed)}></i><i class="u" style=${'width:' + part(f.unnoticed)}></i><i class="x" style=${'width:' + part(f.not_built)}></i><i class="h" style=${'width:' + part(f.not_compiled_here)}></i></div>
      ${total ? html`<div class="legend"><span>Of ${show(f.total)} faults planted in the copies:</span><span><i class="sw n"></i>${show(f.noticed)} noticed, a test failed</span><span><i class="sw u"></i>${show(f.unnoticed)} unnoticed, every test passed</span>${n(f.not_built) ? html`<span><i class="sw x"></i>${show(f.not_built)} not built</span>` : ''}${left ? html`<span><i class="sw"></i>${show(left)} still to run</span>` : ''}</div>` : html`<div class="legend"><span>${over ? 'No fault was planted in this run.' : 'No fault has been planted yet.'}</span></div>`}
      ${state === 'stopped' && html`<div class="notice bad" role="alert"><strong>The tool stopped without finishing.</strong> Last heard at ${clock(s.heartbeat)}. What is shown is the run as it was then; nothing is going on.</div>`}
      ${state === 'quiet' && html`<div class="notice"><span role="status">No word from the tool since ${clock(s.heartbeat)}.</span> That is ${span(age())} ago. It should report every few seconds, also during a build.</div>`}
      ${tests.command_given === false && html`<div class="notice bad" role="alert"><strong>No test command was given.</strong> No fault can be noticed, and every result of this run is empty.</div>`}
      ${tests.command_given !== false && tests.tests_run === 0 && html`<div class="notice bad" role="alert"><strong>Your test command ran no test.</strong> No fault can be noticed, and every result of this run is empty.</div>`}
      ${tests.passed_unchanged === false && html`<div class="notice bad" role="alert"><strong>The build and the tests did not get through on your unchanged code, in any copy.</strong> So no planted fault could be judged, and this run says nothing about your tests. It can be a test that fails, a build that fails, or a machine short of memory while several copies build at once.<${Raw} of=${tests.reason} /></div>`}
      ${dropped.map(function (d) { var w = n((s.copies || {}).working); return html`<div class="notice" role="status"><strong>Working copy ${show(d.copy)} of your project stopped</strong> at ${clock(d.at)}: its build or its tests did not get through there. ${w ? (over ? 'The run went on' : 'The run goes on') + ' with ' + show(w) + ' of ' + show((s.copies || {}).planned) + ' copies, and takes longer.' : 'No copy is left to work with.'} Your repository is not affected.<${Raw} of=${d.reason} /></div>`; })}
      <div class="main">
        <nav class="tree" aria-label="Stages and files">
          ${stages.map(function (x) {
            var mine = files.filter(function (file) { return x.id === 'faults' + (typeof file.side === 'string' ? '-' + file.side : ''); });
            if (!mine.length) return '';
            // The files of a stage that has not begun, or was left out, are shut until someone opens them.
            var key = 'stage ' + x.id, closed = Object.prototype.hasOwnProperty.call(ui.groups, key) ? !ui.groups[key] : ['not begun', 'left out'].indexOf(seenAs(x.status, state)) >= 0;
            return html`<button class="row grp" type="button" aria-expanded=${String(!closed)} onClick=${function () { var next = Object.assign({}, ui.groups); next[key] = closed; set({ groups: next }); }}><span class="fold" aria-hidden="true">${closed ? '▸' : '▾'}</span><span class="name">${text(x.title)}: ${mine.length === 1 ? '1 file' : mine.length + ' files'}</span><span class="count">${n(x.total) ? show(x.done) + ' / ' + show(x.total) : ''}</span></button>
            ${!closed && mine.map(function (file) { var name = text(file.file), key = (typeof file.side === 'string' ? file.side + ' ' : '') + name, shut = folded(key); return html`<button class="row d1" type="button" aria-expanded=${String(!shut)} onClick=${function () { flip(key); }}><span class="fold" aria-hidden="true">${shut ? '▸' : '▾'}</span>${mark(rowAs(file, state))}<span class="name mono" title=${name}>${name.split('/').pop()}</span><span class="count">${counts(file)}</span></button>
              ${!shut && fns.filter(function (fn) { return fn.file === file.file && fn.side === file.side; }).slice(0, 400).map(function (fn) { return html`<div class="row d2">${mark(rowAs(fn, state))}<span class="name mono" title=${text(fn.function)}>${text(fn.function)}</span><span class="count">${counts(fn)}</span></div>`; })}`; })}`; })}
          ${!stages.length && html`<div class="row"><span class="name">No stage is known yet.</span></div>`}
          ${stages.length && !files.length ? html`<div class="row"><span class="name">${over ? 'No file was looked at.' : 'Your files are listed here once the faults are chosen.'}</span></div>` : ''}
          ${stages.length ? html`<div class="key">${Object.keys(MARK).filter(function (k) { return shown[k] === true; }).map(function (k) { return html`<div><span class=${'sign ' + MARK[k][0]} aria-hidden="true">${MARK[k][1]}</span><span>${{ ended: 'done', 'going on': 'going on now', 'not begun': 'not begun yet', 'left out': 'left out: not run' }[k] || MARK[k][2]}</span></div>`; })}</div>` : ''}
        </nav>
        <section class="pane" aria-label="The run in detail">
          <div class="tabs" role="tablist" aria-label="What to show" onKeyDown=${pick}>${tabs.map(function (t) { return html`<button class="tab" type="button" role="tab" id=${'tab-' + t[0]} aria-controls="panel" aria-selected=${String(ui.tab === t[0])} tabindex=${ui.tab === t[0] ? 0 : -1} onClick=${function () { set({ tab: t[0] }); }}>${t[1]}</button>`; })}</div>
          <div class="body" role="tabpanel" id="panel" tabindex="0" aria-labelledby=${'tab-' + ui.tab}>
            ${ui.tab === 'now' && (atResult ? html`<${Result} s=${s} />` : current ? html`<${Stage} stage=${current} state=${state} s=${s} />` : html`<p>Nothing has begun yet.</p>`)}
            ${ui.tab === 'code' && html`<${YourCode} s=${s} />`}
            ${ui.tab === 'faults' && html`<${Faults} s=${s} />`}
            ${ui.tab === 'bare' && html`<${Unprotected} s=${s} />`}
            ${ui.tab === 'result' && html`<${Result} s=${s} />`}
          </div>
        </section>
      </div>
      <footer class="foot"><span>Last heard from the tool: ${clock(s.heartbeat)}</span><span>${over ? 'Copies that worked' : 'Copies working'}: ${show((s.copies || {}).working)} of ${show((s.copies || {}).planned)}</span><span>${state === 'ended' ? 'Took ' : state === 'stopped' ? 'Stopped after ' : 'Running for '}${span(n(s.seconds))}</span><span>${text((s.tool || {}).name, 'lesscode')} ${text((s.tool || {}).version, '')}</span></footer>`;
  }

  function Waiting() {
    return html`<div class="big"><h2>Waiting for lesscode to send its first data</h2><p>This page shows a run of lesscode. It has heard nothing from it for ${span((Date.now() - opened) / 1000)}. ${events ? 'It listens to the tool on this machine.' : 'It was written without a run inside and without a tool to listen to.'}</p>${store.linked === false && html`<p><strong>The tool does not answer.</strong> It may have ended before it sent anything. The report of a run is at the place the tool printed.</p>`}<p>If no run is going on, start one with the option that opens this page. Your code is not touched by opening this page.</p></div>`;
  }
  function CannotRead(p) {
    return html`<div class="big" role="alert"><h2>This page cannot read the run's data</h2><p>${p.why}</p><p>Write the page again with the version of lesscode that made the data. The run itself is not affected: its result is its exit code and its receipt.</p></div>`;
  }

  function App() {
    var tick = useState(0);
    useEffect(function () { var l = function () { tick[1](function (x) { return x + 1; }); }; store.listeners.push(l); return function () { store.listeners = store.listeners.filter(function (x) { return x !== l; }); }; }, []);
    var state = stateOf();
    if (state === 'cannot-read') return html`<${CannotRead} why=${store.problem} />`;
    if (state === 'waiting') return html`<${Waiting} />`;
    return html`<${Run} s=${store.snapshot} state=${state} />`;
  }
  // Drawing must not leave a blank page: a failure becomes the state "cannot read".
  function Guard() {}
  Guard.prototype = Object.create(P.Component.prototype);
  Guard.prototype.componentDidCatch = function (error) { seen.failures += 1; store.problem = 'Drawing the page failed: ' + String(error && error.message || error); this.setState({}); note(); };
  Guard.prototype.render = function () { return store.problem && stateOf() === 'cannot-read' ? html`<${CannotRead} why=${store.problem} />` : html`<${App} />`; };
  P.render(html`<${Guard} />`, document.getElementById('app'));
  note();
})();
</script>
</body>
</html>
