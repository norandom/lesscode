<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lesscode run</title>
<style>
/* A tool window: toolbar, one bar for the run, a tree on the left, tabs on the right, a status line. */
:root {
  --bg: #f7f8fa; --panel: #ffffff; --line: #d3d5db; --ink: #1f2329; --quiet: #5c6370; --hover: #e9ebf0;
  --select: #d4e2ff; --focus: #3574f0; --ok: #1f8a4c; --warn: #b26a00; --bad: #c9352b; --off: #8c93a0;
  --ok-bg: #dff3e6; --warn-bg: #fdefd3; --bad-bg: #fbe1df;
  --ui: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1e1f22; --panel: #2b2d30; --line: #43454a; --ink: #dfe1e5; --quiet: #9da0a8; --hover: #393b40;
  --select: #2e436e; --focus: #548af7; --ok: #5fad65; --warn: #d6a24a; --bad: #e0685f; --off: #7a7e85;
  --ok-bg: #263b2b; --warn-bg: #45381f; --bad-bg: #4a2a28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1e1f22; --panel: #2b2d30; --line: #43454a; --ink: #dfe1e5; --quiet: #9da0a8; --hover: #393b40;
  --select: #2e436e; --focus: #548af7; --ok: #5fad65; --warn: #d6a24a; --bad: #e0685f; --off: #7a7e85;
  --ok-bg: #263b2b; --warn-bg: #45381f; --bad-bg: #4a2a28; color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--ui); }
#app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
code, .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
/* Inside the tree, the tabs and the pane an outline outside the box would be cut off. */
.row:focus-visible, .tab:focus-visible, .body:focus-visible { outline-offset: -2px; }
.said { margin-left: 6px; color: var(--quiet); }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.head h1 { font-size: 13px; font-weight: 600; margin: 0; }
.head .what { color: var(--quiet); min-width: 0; overflow-wrap: anywhere; }
.pill { border-radius: 10px; padding: 1px 9px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.off { background: var(--hover); color: var(--quiet); }
.touch { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; padding: 4px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 3px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tool { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; }
.tool:hover { background: var(--hover); } .tool[aria-pressed="true"] { background: var(--select); border-color: var(--focus); }
.tool svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; }
.bar { display: flex; height: 6px; background: var(--hover); }
.bar i { display: block; height: 100%; } .bar .n { background: var(--ok); } .bar .u { background: var(--warn); } .bar .x { background: var(--off); } .bar .h { background: repeating-linear-gradient(45deg, var(--off) 0 2px, transparent 2px 5px); }
.notice { padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--warn-bg); }
.notice.bad { background: var(--bad-bg); }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 34%) minmax(0, 1fr); }
.tree { overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 4px 0; min-width: 0; }
.row { display: flex; align-items: baseline; gap: 6px; width: 100%; padding: 2px 8px; border: 0; background: none; text-align: left; cursor: pointer; }
.row:hover { background: var(--hover); } .row[aria-current="true"] { background: var(--select); }
.row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.row .count { color: var(--quiet); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mark { width: 14px; flex: none; text-align: center; font-weight: 700; }
.mark.ok { color: var(--ok); } .mark.warn { color: var(--warn); } .mark.bad { color: var(--bad); } .mark.off { color: var(--off); }
.d1 { padding-left: 20px; } .d2 { padding-left: 54px; cursor: default; }
.fold { width: 10px; flex: none; color: var(--quiet); }
.pane { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab { border: 0; border-bottom: 2px solid transparent; background: none; padding: 6px 12px; cursor: pointer; color: var(--quiet); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--focus); }
.body { overflow: auto; padding: 12px 14px 24px; min-width: 0; }
.body h2 { font-size: 15px; margin: 0 0 6px; } .body h3 { font-size: 13px; margin: 14px 0 4px; }
.body p { margin: 0 0 8px; max-width: 70ch; } .body ul { margin: 0 0 8px; padding-left: 18px; max-width: 70ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 0 0 10px; }
.facts dt { color: var(--quiet); } .facts dd { margin: 0; overflow-wrap: anywhere; }
.meter { height: 8px; border-radius: 4px; background: var(--hover); overflow: hidden; max-width: 420px; margin: 4px 0; }
.meter i { display: block; height: 100%; background: var(--focus); }
.meter.busy i { width: 30%; animation: slide 1.6s linear infinite; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
@media (prefers-reduced-motion: reduce) { .meter.busy i { animation: none; width: 100%; opacity: .35; } }
table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--quiet); font-weight: 500; } td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.wide { overflow-x: auto; }
.foot { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 3px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--quiet); font-size: 12px; }
.big { padding: 40px 20px; max-width: 70ch; margin: 0 auto; }
@media (max-width: 640px) { .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(120px, 38%) minmax(0, 1fr); } .tree { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="app"></div>
<script>/*LIB*/</script>
<script>
// Filled by the tool: the address of the run's stream while it goes on, or the run itself at its end.
const events = /*EVENTS*/null;
const data = /*DATA*/null;
</script>
<script>
(function () {
  'use strict';
  var P = window.htmPreact, html = P.html, useState = P.useState, useEffect = P.useEffect;
  // Seconds without a sign of life: "quiet" after the first, "stopped" after the second.
  var QUIET = 15, STOPPED = 60;

  // What the page knows. Drawn from this and from nothing else.
  var store = { snapshot: null, problem: null, linked: null, listeners: [] };
  var seen = { reads: 0, misses: 0, different: 0, failures: 0, last: '' };
  function note() {
    var root = document.documentElement;
    root.dataset.state = stateOf();
    root.dataset.reads = seen.reads; root.dataset.misses = seen.misses;
    root.dataset.different = seen.different; root.dataset.failures = seen.failures;
    root.dataset.sideways = String(root.scrollWidth > root.clientWidth + 1);
    root.dataset.width = String(window.innerWidth);
  }
  function tell() { store.listeners.forEach(function (l) { l(); }); note(); }
  window.addEventListener('error', function (e) {
    seen.failures += 1;
    document.documentElement.dataset.failure = String(e && e.message) + ' at ' + String(e && e.filename).split('/').pop() + ':' + String(e && e.lineno);
    note();
  });

  function take(value) {
    seen.reads += 1;
    if (value === null || typeof value !== 'object' || Array.isArray(value)) {
      var found = value === null ? 'nothing' : Array.isArray(value) ? 'a list' : typeof value === 'string' ? 'a text' : 'a ' + typeof value;
      store.problem = 'The data is not a description of a run: the page found ' + found + ' where the run should be. This page reads version 1 of the data.';
    } else if (value.schema !== 1) {
      store.problem = (value.schema === undefined ? 'The data states no version' : 'The data was written for version ' + String(value.schema) + ' of the page') + '; this page reads version 1.';
    } else {
      var mark = String(value.heartbeat) + '|' + String(value.sequence);
      if (mark !== seen.last) { seen.different += 1; seen.last = mark; }
      store.snapshot = value; store.problem = null;
    }
    tell();
  }
  function age() {
    var s = store.snapshot, t = s && Date.parse(s.heartbeat);
    return isFinite(t) ? Math.max(0, (Date.now() - t) / 1000) : Infinity;
  }
  function stateOf() {
    if (store.problem) return 'cannot-read';
    var s = store.snapshot;
    if (!s) return 'waiting';
    if (s.ended) return 'ended';
    if (store.linked === false) return 'stopped';
    var a = age();
    return a > STOPPED ? 'stopped' : a > QUIET ? 'quiet' : 'running';
  }

  // How the snapshot travels: inside the page, or over the tool's stream.
  var opened = Date.now();
  if (data !== null) take(data);
  if (events && window.EventSource) {
    var stream = new EventSource(events);
    stream.onopen = function () { store.linked = true; tell(); };
    stream.onmessage = function (e) {
      var value;
      try { value = JSON.parse(e.data); } catch (x) { seen.reads += 1; store.problem = 'A message of the tool could not be read as data. This page reads version 1 of the data.'; tell(); return; }
      take(value);
    };
    stream.onerror = function () { store.linked = false; stream.close(); tell(); };
  }
  setInterval(tell, 1000);

  // Small helpers: every field may be missing.
  function n(x) { return typeof x === 'number' && isFinite(x) ? x : null; }
  function show(x, unit) { return n(x) === null ? 'not known' : x.toLocaleString('en') + (unit || ''); }
  function list(x) { return Array.isArray(x) ? x : []; }
  // A list of records. What is not a record is left out, so that drawing never meets one.
  function things(x) { return list(x).filter(function (y) { return y !== null && typeof y === 'object'; }); }
  function text(x, otherwise) { return typeof x === 'string' && x ? x : (otherwise || 'not known'); }
  function span(seconds) {
    if (n(seconds) === null) return 'not known';
    var s = Math.round(seconds), m = Math.floor(s / 60), h = Math.floor(m / 60);
    return h ? h + ' h ' + (m % 60) + ' min' : m ? m + ' min ' + (s % 60) + ' s' : s + ' s';
  }
  function clock(t) { var d = new Date(t); return isNaN(d) ? 'not known' : d.toLocaleTimeString('en-GB'); }
  var MARK = { ended: ['ok', '✓', 'ended'], 'going on': ['warn', '▶', 'going on'], failed: ['bad', '✗', 'failed'],
               'not begun': ['off', '·', 'not begun'], 'left out': ['off', '–', 'left out'],
               stopped: ['bad', '■', 'was going on when the tool stopped'],
               'not here': ['off', '–', 'not built on this system: nothing is known'],
               unnoticed: ['warn', '!', 'some faults were not noticed'], unprotected: ['bad', '✗', 'unprotected: no fault was noticed'] };
  // A file or a function: still being worked on, unprotected, partly noticed, or all noticed.
  function standing(x) {
    if (n(x.left)) return 'going on';
    // Only faults in code that is not built here: nothing is known about it.
    var judged = ['noticed', 'unnoticed', 'not_built', 'timed_out', 'not_judged'].some(function (k) { return n(x[k]); });
    if (!judged && n(x.not_compiled_here)) return 'not here';
    if (x.unprotected === true || (n(x.unnoticed) && !n(x.noticed))) return 'unprotected';
    return n(x.unnoticed) ? 'unnoticed' : 'ended';
  }
  // When the tool has stopped, nothing is shown as going on.
  function seenAs(status, state) { return status === 'going on' && state === 'stopped' ? 'stopped' : status; }
  function mark(status) { var m = MARK[status] || ['off', '?', 'not known']; return html`<span class=${'mark ' + m[0]} role="img" title=${m[2]} aria-label=${m[2]}>${m[1]}</span>`; }

  var ICON = {
    follow: 'M8 1v3M8 12v3M1 8h3M12 8h3M8 5.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 0 0 0-5z',
    expand: 'M3 6l5 5l5-5M3 2h10', collapse: 'M3 10l5-5l5 5M3 14h10',
    noticed: 'M2.5 8.5l3.5 3.5l7.5-8', unnoticed: 'M8 2l6.5 11.5h-13zM8 6.5v3.5M8 12v.2', notbuilt: 'M3 3l10 10M13 3L3 13',
    sort: 'M4 3v10M2 11l2 2l2-2M9 4h5M9 8h4M9 12h2', copy: 'M5 5h8v9H5zM3 11V2h8', help: 'M6 6a2 2 0 1 1 3 1.7c-.7.5-1 .9-1 1.8M8 12v.2M8 1a7 7 0 1 0 0 14a7 7 0 0 0 0-14z'
  };
  function Tool(p) {
    return html`<button class="tool" type="button" title=${p.title} aria-label=${p.title} aria-pressed=${p.pressed === undefined ? null : String(!!p.pressed)} onClick=${p.onClick}>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d=${ICON[p.icon]} /></svg></button>`;
  }

  function Stage(p) {
    var s = p.stage, done = n(s.done), total = n(s.total), status = seenAs(s.status, p.state);
    var counted = done !== null && total !== null && total > 0;
    return html`<div>
      <h2>${text(s.title, 'A stage')}</h2>
      <p>${text(s.what, '')}</p>
      ${status === 'stopped' && html`<p><strong>This stage was going on when the tool stopped.</strong> ${counted ? show(done) + ' of ' + show(total) + ' were done.' : ''}</p>`}
      ${status === 'going on' && counted && html`<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax=${total} aria-valuenow=${done}><i style=${'width:' + Math.min(100, done / total * 100) + '%'}></i></div>
        <p>${show(done)} of ${show(total)} done. ${done >= 5 && n(s.seconds_left) !== null ? 'About ' + span(s.seconds_left) + ' for the rest.' : 'Too early to say how long the rest takes.'}</p>`}
      ${status === 'going on' && !counted && html`<div class="meter busy" role="progressbar" aria-label="working, nothing to count"><i></i></div>
        <p>There is nothing to count in this stage. Going on for ${span(n(s.seconds_so_far))}.</p>`}
      ${s.status === 'ended' && html`<p>Ended after ${span(n(s.seconds))}.</p>`}
      ${s.status === 'failed' && html`<p><strong>Failed.</strong> ${text(s.reason, 'The tool gave no reason.')}</p>`}
      ${s.status === 'not begun' && html`<p>Not begun yet.</p>`}
    </div>`;
  }

  function size(bytes) {
    return bytes >= 1073741824 ? (bytes / 1073741824).toFixed(1) + ' GiB' : bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MiB' : Math.ceil(bytes / 1024) + ' KiB';
  }
  // What the run touches. Each sentence is said only where the snapshot holds its fact.
  function touched(s) {
    var sub = s.subject || {}, c = s.copies || {}, known = function (x) { return typeof x === 'string' && x ? x : null; };
    return { directory: known(c.directory), branch: known(sub.branch), main: sub.on_main_branch === true, dirty: sub.dirty === true,
      // The files the run writes into the repository: a list where the tool has said so and the repository is known.
      written: Array.isArray(s.writes_in_repository) && known(sub.repository) ? s.writes_in_repository.map(String) : null,
      bytes: s.ended === true ? n(c.bytes) : null };
  }
  function named(files) { return files.map(function (f, i) { return html`${i ? ', ' : ''}<code>${f}</code>`; }); }
  // The top of the page, for the whole run.
  function Touches(p) {
    var t = touched(p.s);
    return html`<div class="touch">
      <span>lesscode works in copies of your project${t.directory ? html` under <code>${t.directory}</code>` : ''}.</span>
      ${t.written && !t.written.length ? html`<span>It writes nothing into your repository.</span>` : ''}
      ${t.written && t.written.length ? html`<span>It writes ${named(t.written)} into your repository and nothing else.</span>` : ''}
      ${t.branch ? html`<span>Branch <code>${t.branch}</code>${t.main ? html` <span class="pill warn">this is the main branch</span>` : ''}</span>` : ''}
      ${t.dirty ? html`<span>Your working tree had uncommitted changes when the run began.</span>` : ''}
      ${t.bytes !== null ? html`<span>The copies take ${size(t.bytes)}.</span>` : ''}
    </div>`;
  }

  function YourCode(p) {
    var s = p.s, sub = s.subject || {}, c = s.copies || {}, t = touched(s);
    return html`<div>
      <h2>What happens to your code</h2>
      <p>lesscode works in copies of your project. It reads your repository${t.written && !t.written.length ? ' and writes nothing into it' : ''}. Your project's commands and every planted fault run in the copies only.</p>
      <dl class="facts">
        <dt>Repository</dt><dd><code>${text(sub.repository)}</code></dd>
        <dt>Branch</dt><dd><code>${text(sub.branch)}</code></dd>
        <dt>Commit</dt><dd><code>${text(sub.commit)}</code></dd>
        <dt>Uncommitted changes when the run began</dt><dd>${sub.dirty === true ? 'yes' : sub.dirty === false ? 'none' : 'not known'}</dd>
        <dt>Copies</dt><dd>${show(c.planned)} under <code>${text(c.directory)}</code></dd>
        ${s.ended === true ? html`<dt>Space the copies take</dt><dd>${t.bytes === null ? 'not measured' : size(t.bytes)}</dd>` : ''}
      </dl>
      ${t.main ? html`<p><strong>The run reads the main branch of the repository.</strong> Make the change you plan on a branch of its own, so that a step that is refused is not on the main branch.</p>` : ''}
      <h3>Commands of your project that are run, in the copies only</h3>
      ${list(s.commands).length ? html`<ul>${list(s.commands).map(function (c) { return html`<li><code>${list(c).join(' ')}</code></li>`; })}</ul>` : html`<p>None is known.</p>`}
      ${t.written ? html`<h3>Files written into your repository</h3>
        ${t.written.length ? html`<ul>${t.written.map(function (f) { return html`<li><code>${f}</code></li>`; })}</ul>
          <p>These are the run's own output: its result, this page, or the directory of the copies. It is the only kind of file the run writes there; no file of your project is changed.</p>` : html`<p>None.</p>`}` : ''}
      ${s.ended === true && t.directory ? html`<h3>When you are done</h3><p>To remove the copies, delete the directory <code>${t.directory}</code>. lesscode leaves them so that a next run can use them again.</p>` : ''}
    </div>`;
  }

  function Faults(p) {
    var f = p.s.faults || {}, e = things([f.example])[0];
    return html`<div>
      <h2>What a planted fault is</h2>
      <p>To find out whether your tests would notice a mistake, lesscode makes one on purpose. In a copy of your code it changes one small thing, such as turning a <code>${'<'}</code> into a <code>${'<='}</code> or leaving a statement out, and runs your tests. If a test fails, the fault was noticed. If every test passes, nothing would have told you about that mistake.</p>
      <p>A planted fault lives in a copy. It never reaches your repository.</p>
      ${e ? html`<h3>One from this run</h3>
        <dl class="facts"><dt>Where</dt><dd><code>${text(e.file)}</code>, line ${show(e.line)}${typeof e.function === 'string' && e.function ? html`, in <code>${e.function}</code>` : ''}</dd>
        <dt>The code there</dt><dd><code>${text(e.text, 'not shown')}</code></dd>
        <dt>Kind of change</dt><dd><code>${text(e.what_was_changed)}</code></dd>
        <dt>Did your tests notice</dt><dd>${text(e.outcome)}</dd></dl>` : html`<p>No fault of this run has been judged yet.</p>`}
      <h3>What a noticed fault shows</h3>
      <p>Your tests are sharp at that place: they fail when the code there is wrong. It does not show that two versions of the code behave the same. A rework can pass every test and still differ where no test looks.</p>
      <h3>What an unnoticed fault can mean</h3>
      <ul>
        <li>A test is missing.</li>
        <li>The fault changes nothing a caller can see.</li>
        <li>The fault changes something your tests cannot observe, such as what is drawn on a screen.</li>
      </ul>
      <p>The run cannot tell these three apart. The code at the place can.</p>
      <h3>Counted apart</h3>
      <p>A fault that does not build, or that runs over its time limit, is neither noticed nor unnoticed. It says nothing either way.</p>
      ${n(f.not_compiled_here) ? html`<p>${show(f.not_compiled_here)} faults lie in code that is not built on this system. No test can notice them here, so they tell nothing.</p>` : ''}
    </div>`;
  }

  function Unprotected(p) {
    var all = things((p.s.faults || {}).functions), fs = all.filter(function (f) { return standing(f) !== 'not here'; }), bare = fs.filter(function (f) { return f.unprotected === true; });
    var reaching = bare.some(function (f) { return list(f.reaches_out).length > 0; });
    if (!fs.length) return html`<div><h2>Unprotected functions</h2><p>${p.s.ended === true ? 'No fault was run, so nothing is known about any function.' : 'Which functions are unprotected is known when their faults have been run.'}</p></div>`;
    return html`<div>
      <h2>${bare.length} of ${fs.length} functions are unprotected</h2>
      <p>In an unprotected function no test noticed any planted fault. You can break such a function and every test still passes. Write tests for it before you change it.</p>
      ${all.length > fs.length ? html`<p>${all.length - fs.length} more ${all.length - fs.length === 1 ? 'lies' : 'lie'} wholly in code that is not built on this system. Nothing is known about ${all.length - fs.length === 1 ? 'it' : 'them'}.</p>` : ''}
      ${bare.length ? html`<div class="wide"><table><thead><tr><th scope="col">Function</th><th scope="col">File</th><th scope="col">Faults nobody noticed</th><th scope="col">What it reaches out to</th></tr></thead><tbody>
        ${bare.slice(0, 200).map(function (f) { return html`<tr><td><code>${text(f.function)}</code></td><td><code>${text(f.file)}</code></td><td class="num">${show(f.unnoticed)}</td><td>${list(f.reaches_out).slice(0, 8).join(', ') || 'nothing listed'}</td></tr>`; })}
        </tbody></table></div>
        ${bare.length > 200 ? html`<p>${bare.length - 200} more are in the run's receipt.</p>` : ''}
        ${reaching ? html`<p>Where a function reaches out to a device, a window or a network, tests cannot come first. The code has to be cut into what it decides and what it does before it can be tested.</p>` : ''}` : html`<p>None.</p>`}
    </div>`;
  }

  function Result(p) {
    var s = p.s, r = s.report, f = s.faults || {}, fs = things(f.functions).filter(function (x) { return standing(x) !== 'not here'; });
    var bare = fs.filter(function (x) { return x.unprotected === true; }).length;
    if (!s.ended) return html`<div><h2>Result</h2><p>The run has not ended.</p></div>`;
    return html`<div>
      <h2>${text(s.outcome, 'The run ended')}</h2>
      ${s.outcome_detail ? html`<p>${String(s.outcome_detail)}</p>` : ''}
      <dl class="facts">${fs.length ? html`<dt>Unprotected functions</dt><dd>${bare} of ${fs.length} (${Math.round(bare / fs.length * 100)}%)</dd>` : ''}<dt>Faults planted</dt><dd>${show(f.total)}</dd><dt>Noticed</dt><dd>${show(f.noticed)}</dd><dt>Unnoticed</dt><dd>${show(f.unnoticed)}</dd><dt>Did not build</dt><dd>${show(f.not_built)}</dd>${n(f.not_compiled_here) ? html`<dt>In code not built on this system</dt><dd>${show(f.not_compiled_here)}, counted in no line above; they tell nothing</dd>` : ''}<dt>Time</dt><dd>${span(n(s.seconds))}</dd><dt>Exit code</dt><dd>${show(s.exit_code)}</dd></dl>
      ${r && things(r.lenses).length ? html`<h3>Before and after</h3><div class="wide"><table><thead><tr><th scope="col">Lens</th><th scope="col">Measure</th><th scope="col">Before</th><th scope="col">After</th><th scope="col">Expected</th><th scope="col">Moved that way</th></tr></thead><tbody>
        ${things(r.lenses).map(function (l) { return html`<tr><td>${text(l.lens)}</td><td>${text(l.measure)}</td><td class="num">${l.measured === false ? 'not measured' : text(String(l.before))}</td><td class="num">${l.measured === false ? 'not measured' : text(String(l.after))}</td><td>${text(l.expected)}</td><td>${l.measured === false ? 'not measured' : l.moved === true ? 'yes' : l.moved === false ? 'no' : 'not judged'}</td></tr>`; })}
        </tbody></table></div>` : html`<p>This run compared nothing before and after.</p>`}
      ${r && r.refusal ? html`<h3>Refused</h3><ul>${list(r.refusal.reasons).map(function (x) { return html`<li>${String(x)}</li>`; })}</ul><p>Fix the step. Raising the limit is the decision of whoever owns the code.</p>` : ''}
      <h3>What to do next</h3>
      <ul>${list(s.next).length ? list(s.next).map(function (x) { return html`<li>${String(x)}</li>`; }) : html`<li>Nothing is proposed.</li>`}</ul>
    </div>`;
  }

  function Run(p) {
    var s = p.s, state = p.state, f = s.faults || {}, stages = things(s.stages);
    var going = stages.filter(function (x) { return x.status === 'going on'; })[0];
    // A file's functions are hidden when all are shut and it was not opened, or when it was shut alone.
    var st = useState({ tab: 'now', follow: true, picked: null, shut: false, flipped: {}, noticed: true, unnoticed: true, notbuilt: true, byUnnoticed: true, copied: false });
    var ui = st[0], set = function (change) { st[1](Object.assign({}, ui, change)); };
    var current = ui.follow || !ui.picked ? (going || stages[stages.length - 1]) : stages.filter(function (x) { return x.id === ui.picked; })[0];
    var folded = function (key) { return ui.shut !== (ui.flipped[key] === true); };
    var flip = function (key) { var next = Object.assign({}, ui.flipped); next[key] = !next[key]; set({ flipped: next }); };
    var over = state === 'ended' || state === 'stopped';
    var total = n(f.total) || 0, part = function (x) { return total ? Math.max(0, (n(x) || 0) / total * 100) + '%' : '0%'; };
    var files = things(f.files), fns = things(f.functions);
    if (ui.byUnnoticed) { files.sort(function (a, b) { return (n(b.unnoticed) || 0) - (n(a.unnoticed) || 0); }); fns.sort(function (a, b) { return (n(b.unnoticed) || 0) - (n(a.unnoticed) || 0); }); }
    var counts = function (x) { return [ui.noticed && show(x.noticed) + ' noticed', ui.unnoticed && show(x.unnoticed) + ' unnoticed', ui.notbuilt && n(x.not_built) ? show(x.not_built) + ' not built' : null, n(x.not_compiled_here) ? show(x.not_compiled_here) + ' not built here' : null].filter(Boolean).join(' · '); };
    var pill = { running: ['warn', 'Running'], quiet: ['warn', 'Quiet'], stopped: ['bad', 'The tool stopped'], ended: [s.exit_code === 0 ? 'ok' : 'warn', 'Ended'] }[state] || ['off', state];
    var dropped = things((s.copies || {}).dropped), tests = s.tests || {};
    var bare = fns.filter(function (x) { return x.unprotected === true; }).length;
    var copy = function () {
      var d = text((s.copies || {}).directory, ''), no = function () { set({ copied: 'no' }); };
      if (navigator.clipboard && d) navigator.clipboard.writeText(d).then(function () { set({ copied: 'yes' }); }, no); else no();
    };
    // The tabs as one stop for the keyboard: the arrows move between them.
    var pick = function (e) {
      var at = tabs.map(function (t) { return t[0]; }).indexOf(ui.tab), to = { ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      var next = tabs[(to + tabs.length) % tabs.length][0], el = document.getElementById('tab-' + next);
      set({ tab: next });
      if (el) el.focus();
    };
    var tabs = [['now', 'Now'], ['code', 'Your code'], ['faults', 'Planted faults'], ['bare', 'Unprotected' + (bare ? ' (' + bare + ')' : '')], ['result', 'Result']];
    return html`
      <header class="head"><h1>lesscode</h1><span class="what"><code>${text(s.command)}</code> on <code>${text((s.subject || {}).repository)}</code> at <code>${text((s.subject || {}).commit).slice(0, 12)}</code></span><span class=${'pill ' + pill[0]} role="status">${pill[1]}</span></header>
      <${Touches} s=${s} />
      <div class="tools" role="toolbar" aria-label="View">
        <${Tool} icon="follow" title="Follow the stage that is going on" pressed=${ui.follow} onClick=${function () { set({ follow: !ui.follow, picked: null, tab: 'now' }); }} />
        <span class="sep"></span>
        <${Tool} icon="expand" title="Show the functions of every file" onClick=${function () { set({ shut: false, flipped: {} }); }} />
        <${Tool} icon="collapse" title="Hide the functions of every file" onClick=${function () { set({ shut: true, flipped: {} }); }} />
        <span class="sep"></span>
        <${Tool} icon="noticed" title="Show noticed faults" pressed=${ui.noticed} onClick=${function () { set({ noticed: !ui.noticed }); }} />
        <${Tool} icon="unnoticed" title="Show unnoticed faults" pressed=${ui.unnoticed} onClick=${function () { set({ unnoticed: !ui.unnoticed }); }} />
        <${Tool} icon="notbuilt" title="Show faults that did not build" pressed=${ui.notbuilt} onClick=${function () { set({ notbuilt: !ui.notbuilt }); }} />
        <${Tool} icon="sort" title="Sort by unnoticed faults" pressed=${ui.byUnnoticed} onClick=${function () { set({ byUnnoticed: !ui.byUnnoticed }); }} />
        <span class="sep"></span>
        <${Tool} icon="copy" title="Copy the place of the copies" onClick=${copy} />
        <${Tool} icon="help" title="What a planted fault is" onClick=${function () { set({ tab: 'faults' }); }} />
        <span class="said" role="status">${ui.copied === 'yes' ? 'Copied' : ui.copied === 'no' ? 'Could not copy. The place is in the tab Your code.' : ''}</span>
      </div>
      <div class="bar" role="img" aria-label=${show(f.noticed) + ' noticed, ' + show(f.unnoticed) + ' unnoticed, ' + show(f.not_built) + ' not built, ' + (n(f.not_compiled_here) ? show(f.not_compiled_here) + ' in code not built on this system, ' : '') + 'of ' + show(f.total)}><i class="n" style=${'width:' + part(f.noticed)}></i><i class="u" style=${'width:' + part(f.unnoticed)}></i><i class="x" style=${'width:' + part(f.not_built)}></i><i class="h" style=${'width:' + part(f.not_compiled_here)}></i></div>
      ${state === 'stopped' && html`<div class="notice bad" role="alert"><strong>The tool stopped without finishing.</strong> Last heard at ${clock(s.heartbeat)}. What is shown is the run as it was then; nothing is going on.</div>`}
      ${state === 'quiet' && html`<div class="notice"><span role="status">No word from the tool since ${clock(s.heartbeat)}.</span> That is ${span(age())} ago. It should report every few seconds, also during a build.</div>`}
      ${tests.command_given === false && html`<div class="notice bad" role="alert"><strong>No test command was given.</strong> No fault can be noticed, and every result of this run is empty.</div>`}
      ${tests.command_given !== false && tests.tests_run === 0 && html`<div class="notice bad" role="alert"><strong>Your test command ran no test.</strong> No fault can be noticed, and every result of this run is empty.</div>`}
      ${tests.passed_unchanged === false && html`<div class="notice bad" role="alert"><strong>Your tests do not pass on the unchanged code.</strong> The run cannot judge anything. ${text(tests.reason, '')}</div>`}
      ${dropped.map(function (d) { return html`<div class="notice" role="status"><strong>Copy ${show(d.copy)} dropped out</strong> at ${clock(d.at)}: ${text(d.reason, 'no reason given')}. ${show((s.copies || {}).working)} of ${show((s.copies || {}).planned)} copies are still working.</div>`; })}
      <div class="main">
        <nav class="tree" aria-label="Stages and files">
          ${stages.map(function (x) { return html`<button class="row" type="button" aria-current=${String(current === x)} onClick=${function () { set({ picked: x.id, follow: false, tab: 'now' }); }}>${mark(seenAs(x.status, state))}<span class="name">${text(x.title)}</span><span class="count">${n(x.total) ? show(x.done) + ' / ' + show(x.total) : ''}</span></button>
            ${x.id === 'faults' && files.map(function (file) { var key = text(file.file), shut = folded(key); return html`<button class="row d1" type="button" aria-expanded=${String(!shut)} onClick=${function () { flip(key); }}><span class="fold" aria-hidden="true">${shut ? '▸' : '▾'}</span>${mark(seenAs(standing(file), state))}<span class="name mono" title=${key}>${key.split('/').pop()}</span><span class="count">${counts(file)}</span></button>
              ${!shut && fns.filter(function (fn) { return fn.file === file.file; }).slice(0, 400).map(function (fn) { return html`<div class="row d2">${mark(seenAs(standing(fn), state))}<span class="name mono" title=${text(fn.function)}>${text(fn.function)}</span><span class="count">${counts(fn)}</span></div>`; })}`; })}`; })}
          ${!stages.length && html`<div class="row"><span class="name">No stage is known yet.</span></div>`}
        </nav>
        <section class="pane" aria-label="The run in detail">
          <div class="tabs" role="tablist" aria-label="What to show" onKeyDown=${pick}>${tabs.map(function (t) { return html`<button class="tab" type="button" role="tab" id=${'tab-' + t[0]} aria-controls="panel" aria-selected=${String(ui.tab === t[0])} tabindex=${ui.tab === t[0] ? 0 : -1} onClick=${function () { set({ tab: t[0] }); }}>${t[1]}</button>`; })}</div>
          <div class="body" role="tabpanel" id="panel" tabindex="0" aria-labelledby=${'tab-' + ui.tab}>
            ${ui.tab === 'now' && (state === 'ended' ? html`<${Result} s=${s} />` : current ? html`<${Stage} stage=${current} state=${state} />` : html`<p>Nothing has begun yet.</p>`)}
            ${ui.tab === 'code' && html`<${YourCode} s=${s} />`}
            ${ui.tab === 'faults' && html`<${Faults} s=${s} />`}
            ${ui.tab === 'bare' && html`<${Unprotected} s=${s} />`}
            ${ui.tab === 'result' && html`<${Result} s=${s} />`}
          </div>
        </section>
      </div>
      <footer class="foot"><span>Last heard from the tool: ${clock(s.heartbeat)}</span><span>${over ? 'Copies that worked' : 'Copies working'}: ${show((s.copies || {}).working)} of ${show((s.copies || {}).planned)}</span><span>${state === 'ended' ? 'Took ' : state === 'stopped' ? 'Stopped after ' : 'Running for '}${span(n(s.seconds))}</span><span>${text((s.tool || {}).name, 'lesscode')} ${text((s.tool || {}).version, '')}</span></footer>`;
  }

  function Waiting() {
    return html`<div class="big"><h2>Waiting for lesscode to send its first data</h2><p>This page shows a run of lesscode. It has heard nothing from it for ${span((Date.now() - opened) / 1000)}. ${events ? 'It listens to the tool on this machine.' : 'It was written without a run inside and without a tool to listen to.'}</p>${store.linked === false && html`<p><strong>The tool does not answer.</strong> It may have ended before it sent anything. The report of a run is at the place the tool printed.</p>`}<p>If no run is going on, start one with the option that opens this page. Your code is not touched by opening this page.</p></div>`;
  }
  function CannotRead(p) {
    return html`<div class="big" role="alert"><h2>This page cannot read the run's data</h2><p>${p.why}</p><p>Write the page again with the version of lesscode that made the data. The run itself is not affected: its result is its exit code and its receipt.</p></div>`;
  }

  function App() {
    var tick = useState(0);
    useEffect(function () { var l = function () { tick[1](function (x) { return x + 1; }); }; store.listeners.push(l); return function () { store.listeners = store.listeners.filter(function (x) { return x !== l; }); }; }, []);
    var state = stateOf();
    if (state === 'cannot-read') return html`<${CannotRead} why=${store.problem} />`;
    if (state === 'waiting') return html`<${Waiting} />`;
    return html`<${Run} s=${store.snapshot} state=${state} />`;
  }
  // Drawing must not leave a blank page: a failure becomes the state "cannot read".
  function Guard() {}
  Guard.prototype = Object.create(P.Component.prototype);
  Guard.prototype.componentDidCatch = function (error) { seen.failures += 1; store.problem = 'Drawing the page failed: ' + String(error && error.message || error); this.setState({}); note(); };
  Guard.prototype.render = function () { return store.problem && stateOf() === 'cannot-read' ? html`<${CannotRead} why=${store.problem} />` : html`<${App} />`; };
  P.render(html`<${Guard} />`, document.getElementById('app'));
  note();
})();
</script>
</body>
</html>
