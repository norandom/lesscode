[package]
name = "lesscode-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
description = "Native foundation for capability-scoped code compression"
license = "MIT"

[dependencies]
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false, features = ["tree-sitter-python", "tree-sitter-typescript"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
clap = { version = "=4.6.0", features = ["derive"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
# openai-compatible HTTP adapter (task 8.5, R36 dependency decision)
ureq = "=3.5.1"
