[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lesscode-baseline"
dynamic = ["version"]
description = "Local evidence for supplied Python code simplifications"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
test = ["pytest==9.1.1", "pytest-xdist==3.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
lesscode-baseline = "lesscode_baseline.cli:main"

[tool.setuptools.dynamic]
version = {attr = "lesscode_baseline.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lesscode_baseline = ["data/requirements-tools.lock", "data/tools/package-lock.json"]
