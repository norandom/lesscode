name: Baseline native platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    env:
      UV_PYTHON: '3.12.10'
    steps:
      - name: Initialize native runner evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-evidence"
          printf '%s\n' "$RUNNER_OS/$RUNNER_ARCH" > "$RUNNER_TEMP/baseline-evidence/runner.txt"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-tools.lock
            requirements-test.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install explicit uv-managed CPython
        shell: bash
        run: |
          uv python install 3.12.10 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/python-install.txt"
          uv venv --managed-python --python 3.12.10 .venv-ci 2>&1 | tee "$RUNNER_TEMP/baseline-evidence/venv-setup.txt"
      - name: Locked setup, native tests, clean installed pilot
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            CI_PYTHON="$GITHUB_WORKSPACE/.venv-ci/Scripts/python.exe"
          else
            CI_PYTHON="$GITHUB_WORKSPACE/.venv-ci/bin/python"
          fi
          uv pip install --python "$CI_PYTHON" --require-hashes -r requirements-test.lock
          uv run --no-project --no-python-downloads --python "$CI_PYTHON" python tools/ci_validate.py --out "$RUNNER_TEMP/baseline-evidence/validation"
      - name: Retain native results, including failed stages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/baseline-evidence/
            !${{ runner.temp }}/baseline-evidence/validation/installed/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
