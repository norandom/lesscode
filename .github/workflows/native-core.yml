name: Native core correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native core ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize runner evidence
        run: |
          mkdir -p "$RUNNER_TEMP/native-core-evidence"
          printf '%s\n' "$RUNNER_OS/$RUNNER_ARCH" > "$RUNNER_TEMP/native-core-evidence/runner.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/native-core-evidence/source-revision.txt"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust and development components
        id: toolchain
        run: |
          set +e
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy 2>&1 | tee "$RUNNER_TEMP/native-core-evidence/toolchain.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/native-core-evidence/toolchain.exit-code"
          exit "$status"
      - name: Install pinned native test runner
        run: cargo +1.98.1 install --locked cargo-nextest --version 0.9.143
      - name: Check native correctness with locked dependencies
        id: checks
        run: |
          set +e
          failed=0
          run_check() {
            local label="$1"
            shift
            "$@" 2>&1 | tee "$RUNNER_TEMP/native-core-evidence/$label.log"
            local status=${PIPESTATUS[0]}
            printf '%s\n' "$status" > "$RUNNER_TEMP/native-core-evidence/$label.exit-code"
            if [ "$status" -ne 0 ]; then failed=1; fi
          }
          run_check rustc rustc +1.98.1 --version --verbose
          run_check cargo cargo +1.98.1 --version --verbose
          run_check nextest cargo +1.98.1 nextest --version
          run_check fmt cargo +1.98.1 fmt --manifest-path native/Cargo.toml --all -- --check
          run_check clippy cargo +1.98.1 clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
          run_check test cargo +1.98.1 nextest run --locked --manifest-path native/Cargo.toml --test-threads 4 --no-fail-fast
          run_check doctest cargo +1.98.1 test --locked --manifest-path native/Cargo.toml --doc
          run_check build cargo +1.98.1 build --locked --manifest-path native/Cargo.toml
          run_check help cargo +1.98.1 run --locked --manifest-path native/Cargo.toml -- --help
          exit "$failed"
      - name: Record platform outcome
        if: always()
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-core-evidence"
          {
            printf 'Runner: %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'Source: %s\n' "$GITHUB_SHA"
            printf 'Toolchain: %s\nChecks: %s\n' "$TOOLCHAIN_OUTCOME" "$CHECKS_OUTCOME"
            printf '%s\n' 'A failed, cancelled, or skipped check is not passing platform evidence.'
          } | tee "$RUNNER_TEMP/native-core-evidence/outcome.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-core-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-core-evidence/
          if-no-files-found: warn
          retention-days: 14
