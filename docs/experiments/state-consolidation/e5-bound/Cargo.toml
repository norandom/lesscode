[package]
name = "e5-bound"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
default-run = "e5-bound"

[[bin]]
name = "discover-machine"
path = "../machine-discovery/main.rs"

[[bin]]
name = "protocol-review"
path = "../protocol-review/main.rs"

[[bin]]
name = "worker-trace"
path = "../worker-trace/main.rs"

[dependencies]
lesscode-core = { path = "../../../../native" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
