[package]
name = "annotation-driver-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
description = "Sizing spike: Rust port of the model-free part of the annotation-driver prototype"
license = "MIT"

# Standalone: not a member of any workspace.
[workspace]

[dependencies]
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false, features = ["tree-sitter-rust", "tree-sitter-java", "tree-sitter-python", "tree-sitter-typescript"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
