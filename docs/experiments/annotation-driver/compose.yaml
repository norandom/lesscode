# Linux-side tools for the agnostic-annotation-driver prototype gate.
# Scopes are isolated clones under SCOPES_DIR (never the upstream checkouts).
#
#   $env:SCOPES_DIR = 'D:\BuildArtifacts\lesscode\annotation-driver\scopes'
#   docker compose -f docs/experiments/annotation-driver/compose.yaml run --rm java-tests
#
# JAVA_TEST selects the surefire test class (default LexerTest).
name: lesscode-annotation-driver

services:
  java-tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /scope
    volumes:
      - ${SCOPES_DIR:?set SCOPES_DIR to the isolated scopes directory}/commons-csv:/scope
      - maven-repo:/root/.m2
    # Only compile and run the selected test class; the project's reporting
    # and license-audit plugins are not part of the behavioral baseline.
    # The test run ends itself after 240 s, so a mutant that loops forever cannot
    # leave a container running once the harness (limit 180 s) has given up on it.
    command:
      - timeout
      - -s
      - KILL
      - "240"
      - mvn
      - -B
      - -q
      - -Drat.skip=true
      - -Dcheckstyle.skip=true
      - -Dspotbugs.skip=true
      - -Dpmd.skip=true
      - -Djapicmp.skip=true
      - -Djacoco.skip=true
      - -Danimal.sniffer.skip=true
      - -Dsurefire.failIfNoSpecifiedTests=false
      - -Dtest=${JAVA_TEST:-LexerTest}
      - test

  # Long-lived variant: started once per batch, each test run is an exec in it,
  # so the container and Maven's start-up are not paid per mutant.
  java-worker:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /scope
    volumes:
      - ${SCOPES_DIR:?set SCOPES_DIR to the isolated scopes directory}/commons-csv:/scope
      - maven-repo:/root/.m2
      - ./java-fast-test.sh:/opt/ad/java-fast-test.sh:ro
    command: ["sleep", "infinity"]

volumes:
  # One fixed name, so every project (one per worker copy, COMPOSE_PROJECT_NAME
  # in scopes.json) uses the same populated repository for `mvn -o`.
  maven-repo:
    name: lesscode-annotation-driver_maven-repo
