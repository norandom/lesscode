[package]
name = "model-seam-prototype-wait"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Prototype gate P3 for the model seam: recognising a refusal to wait out, estimating the wait and telling the user. Not part of lesscode-core."
license = "MIT"

# Standalone: not a member of any workspace and not a dependency of the product crate.
[workspace]

[dependencies]
lesscode-core = { path = "../../../../native" }
genai = "=0.7.4"
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "=1.0.154"
