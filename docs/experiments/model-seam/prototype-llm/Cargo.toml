[package]
name = "model-seam-prototype-llm"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Prototype gate P1 for the model seam: the same turn through a second client library (llm). Not part of lesscode-core."
license = "MIT"

# Standalone: not a member of any workspace and not a dependency of the product crate.
[workspace]

[dependencies]
lesscode-core = { path = "../../../../native" }
llm = { version = "=1.3.8", default-features = false, features = ["openai", "anthropic", "mistral", "default-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "=1.0.154"

