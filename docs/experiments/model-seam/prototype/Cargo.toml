[package]
name = "model-seam-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Prototype gate for the model seam: one regenerate-like turn through an existing model client library. Not part of lesscode-core."
license = "MIT"

# Standalone: not a member of any workspace and not a dependency of the product crate.
[workspace]

# Gate P2 builds the crate once with each TLS option of the library.
[features]
default = ["tls-rustls"]
tls-rustls = ["genai/rustls-tls"]
tls-native = ["genai/native-tls"]

[dependencies]
lesscode-core = { path = "../../../../native" }
genai = { version = "=0.7.4", default-features = false, features = ["system-proxy"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "=1.0.154"
