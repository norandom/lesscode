# E1b Arm A: seed tests (R16 harness + seeds.md).
# Run from the arm's own working copy of the frozen source (cosmic-ray mutates files in place),
# never from .runs/e2-facdrone/source. Timeout rule: `sample_mutants.py timeout T_A T_B`.
[cosmic-ray]
module-path = ["src/facdrone/shells/decision_evidence_publication.py", "src/facdrone/shells/cppi/state_repository.py"]
timeout = 2122.2  # backstop: largest measured deadline + 120 s
excluded-modules = []
test-command = "D:/Source/lesscode/.runs/e2-facdrone/venv/Scripts/python.exe D:/Source/lesscode/docs/experiments/deconvolution/e1b-facdrone-evidence-publication/run_arm.py A --deadline auto"

[cosmic-ray.distributor]
name = "local"
