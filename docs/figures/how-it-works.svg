<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1010" width="880" height="1010" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>How lesscode works in three steps: simplify a piece of code, let a model do the rewriting inside constraints, and let your tests decide on a Git branch</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
</defs>
<rect width="880" height="1010" fill="#fcfcfb"/>

<!-- ============ step 1 ============ -->
<circle cx="40" cy="44" r="16" fill="#0b0b0b"/><text x="40" y="49" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="68" y="42" font-size="17" fill="#0b0b0b" font-weight="600">Take one tangled piece and write it simpler</text>
<text x="68" y="62" font-size="12.5" fill="#52514e">Same checks, same results. The set-up happens once and the function leaves through one door.</text>

<!-- before -->
<rect x="24" y="80" width="400" height="356" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="40" y="104" font-size="13" fill="#0b0b0b" font-weight="600">Before</text>
<text x="408" y="104" font-size="11.5" fill="#898781" text-anchor="end">5 branches · set-up inside a branch · 2 exits</text>
<g font-size="11.5" fill="#0b0b0b" text-anchor="middle">
  <!-- decisions -->
  <rect x="150" y="118" width="130" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="215" y="135">exit code is 0 ?</text>
  <rect x="52" y="164" width="112" height="26" rx="4" fill="#fdeee7" stroke="#eb6834"/><text x="108" y="181">reasons = [ ]</text>
  <rect x="266" y="164" width="136" height="26" rx="4" fill="#fdeee7" stroke="#eb6834"/><text x="334" y="181">reasons = [exit n]</text>
  <rect x="150" y="210" width="130" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="215" y="227">replay stale ?</text>
  <rect x="290" y="232" width="112" height="26" rx="4" fill="#fdeee7" stroke="#eb6834"/><text x="346" y="249">reasons.push</text>
  <rect x="134" y="278" width="162" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="215" y="295">differences unbacked ?</text>
  <rect x="40" y="300" width="112" height="26" rx="4" fill="#fdeee7" stroke="#eb6834"/><text x="96" y="317">reasons.push</text>
  <rect x="150" y="346" width="130" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="215" y="363">no reasons ?</text>
  <rect x="296" y="346" width="106" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="349" y="363">exit code 2 ?</text>
  <!-- exits -->
  <rect x="40" y="392" width="92" height="26" rx="4" fill="#0b0b0b"/><text x="86" y="409" fill="#ffffff">return 0</text>
  <rect x="290" y="392" width="118" height="26" rx="4" fill="#0b0b0b"/><text x="349" y="409" fill="#ffffff">return 2 or 1</text>
</g>
<g fill="none" stroke="#898781" stroke-width="1.3" marker-end="url(#a)">
  <path d="M150,131 H108 V164"/><path d="M280,131 H334 V164"/>
  <path d="M108,190 V223 H150"/><path d="M334,190 V204 H232 V210"/>
  <path d="M280,223 H346 V232"/><path d="M346,258 V268 H240 V278"/><path d="M200,236 V278"/>
  <path d="M134,291 H96 V300"/><path d="M96,326 V359 H150"/><path d="M228,304 V346"/>
  <path d="M190,372 V382 H86 V392"/><path d="M280,359 H296"/>
  <path d="M349,372 V392"/>
</g>

<!-- arrow between -->
<path d="M432,258 H448" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#b)" fill="none"/>

<!-- after -->
<rect x="456" y="80" width="400" height="356" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
<text x="472" y="104" font-size="13" fill="#0b0b0b" font-weight="600">After</text>
<text x="840" y="104" font-size="11.5" fill="#898781" text-anchor="end">one line of checks · set-up once · 1 exit</text>
<g font-size="11.5" fill="#0b0b0b" text-anchor="middle">
  <rect x="586" y="124" width="140" height="26" rx="4" fill="#fdeee7" stroke="#eb6834"/><text x="656" y="141">reasons = [ ]</text>
  <rect x="546" y="176" width="220" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="656" y="193">exit code not 0 → add a reason</text>
  <rect x="546" y="222" width="220" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="656" y="239">replay stale → add a reason</text>
  <rect x="546" y="268" width="220" height="26" rx="13" fill="#eaf2fd" stroke="#2a78d6"/><text x="656" y="285">differences unbacked → add a reason</text>
  <rect x="556" y="320" width="200" height="26" rx="4" fill="#eaf2fd" stroke="#2a78d6"/><text x="656" y="337">code = 0, 2 or 1</text>
  <rect x="596" y="372" width="120" height="26" rx="4" fill="#0b0b0b"/><text x="656" y="389" fill="#ffffff">return</text>
</g>
<g fill="none" stroke="#898781" stroke-width="1.3" marker-end="url(#a)">
  <path d="M656,150 V176"/><path d="M656,202 V222"/><path d="M656,248 V268"/><path d="M656,294 V320"/><path d="M656,346 V372"/>
</g>
<g font-size="11.5" fill="#52514e">
  <rect x="40" y="446" width="12" height="12" rx="6" fill="#eaf2fd" stroke="#2a78d6"/><text x="58" y="456">a decision</text>
  <rect x="132" y="446" width="12" height="12" rx="2" fill="#fdeee7" stroke="#eb6834"/><text x="150" y="456">state is written</text>
  <rect x="254" y="446" width="12" height="12" rx="2" fill="#0b0b0b"/><text x="272" y="456">the function returns</text>
  <text x="856" y="456" text-anchor="end">a real function, drawn simplified: verdict() in native/src/recording.rs</text>
</g>

<!-- ============ step 2 ============ -->
<line x1="24" y1="486" x2="856" y2="486" stroke="#e1e0d9"/>
<circle cx="40" cy="522" r="16" fill="#0b0b0b"/><text x="40" y="527" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="68" y="520" font-size="17" fill="#0b0b0b" font-weight="600">A model does the rewriting, inside limits it cannot move</text>
<text x="68" y="540" font-size="12.5" fill="#52514e">The model proposes. Mechanical checks decide what is let through.</text>
<g font-size="12" fill="#0b0b0b">
  <rect x="24" y="560" width="264" height="150" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
  <text x="40" y="586" font-size="13" font-weight="600">Constraints</text>
  <text x="40" y="610" fill="#52514e">The public surface stays as it is.</text>
  <text x="40" y="630" fill="#52514e">Where state may be written is</text>
  <text x="40" y="646" fill="#52514e">declared, not discovered later.</text>
  <text x="40" y="670" fill="#52514e">Smaller means fewer tokens,</text>
  <text x="40" y="686" fill="#52514e">not fewer lines.</text>

  <rect x="308" y="560" width="264" height="150" rx="10" fill="#ffffff" stroke="#2a78d6"/>
  <text x="324" y="586" font-size="13" font-weight="600">LLM drivers</text>
  <text x="324" y="610" fill="#52514e">One scope at a time, with the</text>
  <text x="324" y="626" fill="#52514e">constraints in the prompt.</text>
  <text x="324" y="650" fill="#52514e">Prompts are tuned by search</text>
  <text x="324" y="666" fill="#52514e">(GEPA, MIPROv2), judged by the</text>
  <text x="324" y="682" fill="#52514e">checks on the right, not by taste.</text>

  <rect x="592" y="560" width="264" height="150" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
  <text x="608" y="586" font-size="13" font-weight="600">Barrier</text>
  <text x="608" y="610" fill="#52514e">Does it parse and build?</text>
  <text x="608" y="630" fill="#52514e">Does it stay inside the declared</text>
  <text x="608" y="646" fill="#52514e">state and surface?</text>
  <text x="608" y="670" fill="#52514e">Anything that fails is dropped,</text>
  <text x="608" y="686" fill="#52514e">whatever the model says about it.</text>
</g>
<path d="M288,635 H306" stroke="#898781" stroke-width="1.3" marker-end="url(#a)" fill="none"/>
<path d="M572,635 H590" stroke="#898781" stroke-width="1.3" marker-end="url(#a)" fill="none"/>

<!-- ============ step 3 ============ -->
<line x1="24" y1="740" x2="856" y2="740" stroke="#e1e0d9"/>
<circle cx="40" cy="776" r="16" fill="#0b0b0b"/><text x="40" y="781" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="68" y="774" font-size="17" fill="#0b0b0b" font-weight="600">It lands on a Git branch, and your tests decide</text>
<text x="68" y="794" font-size="12.5" fill="#52514e">Nothing touches main. The tool works in copies of your tree and never writes to the tree itself.</text>

<!-- git graph -->
<g stroke-width="2.5" fill="none">
  <path d="M60,856 H820" stroke="#898781"/>
  <path d="M200,856 C240,856 240,916 290,916 H620 C670,916 670,856 710,856" stroke="#2a78d6"/>
</g>
<g>
  <circle cx="90" cy="856" r="7" fill="#898781"/><circle cx="200" cy="856" r="7" fill="#898781"/>
  <circle cx="710" cy="856" r="8" fill="#fcfcfb" stroke="#898781" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="300" cy="916" r="7" fill="#2a78d6"/>
  <text x="60" y="838" font-size="12" fill="#52514e">main</text>
  <text x="300" y="944" font-size="12" fill="#0b0b0b" text-anchor="middle">simpler/verdict</text>
  <text x="710" y="838" font-size="12" fill="#52514e" text-anchor="middle">you merge, or you don't</text>
</g>
<g font-size="11.5" fill="#0b0b0b" text-anchor="middle">
  <rect x="350" y="902" width="118" height="28" rx="14" fill="#e6f6ef" stroke="#1baf7a"/><text x="409" y="920">✓ your test suite</text>
  <rect x="478" y="902" width="132" height="28" rx="14" fill="#e6f6ef" stroke="#1baf7a"/><text x="544" y="920">✓ planted faults</text>
</g>
<g font-size="12" fill="#52514e">
  <text x="350" y="960">Your tests still pass on the branch.</text>
  <text x="350" y="978">Then small faults are planted in the new code, one at a time:</text>
  <text x="350" y="996">do your tests notice? Where they don't, a cut is not protected.</text>
  <text x="60" y="978" fill="#0b0b0b" font-weight="600">openidea-kiro has your back:</text>
  <text x="60" y="996">spec stays consistent, code stays changeable.</text>
</g>
</svg>
