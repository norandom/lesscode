<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 906" width="880" height="906" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>Three things you do: see where your tests guard the code, pin and then simplify one function, and let one check decide on the branch before you push</title>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#59636e"/></marker></defs>
<rect width="880" height="906" fill="#ffffff"/>
<circle cx="32" cy="30" r="13" fill="#1f2328"/>
<text x="32" y="35" fill="#ffffff" xml:space="preserve" font-weight="600" font-size="13" text-anchor="middle">1</text>
<text x="54" y="28" fill="#1f2328" xml:space="preserve" font-weight="600" font-size="15">See where your tests guard the code</text>
<text x="54" y="45" fill="#59636e" xml:space="preserve" >Small faults are planted one at a time, in a copy. Do your tests notice?</text>
<rect x="20" y="58" width="840" height="132" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="34" y="80" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5"><tspan fill="#59636e">$</tspan> lesscode-core step plan --config run.json --work ../work --out plan.json</text>
<text x="34" y="102" fill="#59636e" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">function                              noticed  unnoticed  tokens</text>
<text x="34" y="120" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">recording.rs: replay_to_l2                  0         20    1010   no fault noticed</text>
<text x="34" y="138" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">recording.rs: assemble_meta                 0         17     824   no fault noticed</text>
<text x="34" y="156" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">recording.rs: verdict                      10          1     151</text>
<text x="34" y="174" fill="#59636e" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">... 28 more functions</text>
<rect x="28" y="144" width="560" height="17" rx="3" fill="none" stroke="#0969da" stroke-width="1.5"/>
<path d="M650,152 H596" stroke="#59636e" stroke-width="1.2" fill="none" marker-end="url(#tip)"/>
<text x="656" y="120" fill="#59636e" xml:space="preserve" >not today: nothing guards these</text>
<text x="656" y="149" fill="#1f2328" xml:space="preserve" font-weight="600">start here:</text>
<text x="656" y="164" fill="#59636e" xml:space="preserve" >one test away from fully guarded</text>
<circle cx="32" cy="228" r="13" fill="#1f2328"/>
<text x="32" y="233" fill="#ffffff" xml:space="preserve" font-weight="600" font-size="13" text-anchor="middle">2</text>
<text x="54" y="226" fill="#1f2328" xml:space="preserve" font-weight="600" font-size="15">Pin first, then make it simpler</text>
<text x="54" y="243" fill="#59636e" xml:space="preserve" >You or a model write the test and the change. Whether the test counts is checked, not assumed.</text>
<rect x="20" y="256" width="840" height="50" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="34" y="277" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5"><tspan fill="#59636e">$</tspan> lesscode-core step pin --declaration step.json --fault 2 --work ../work</text>
<text x="34" y="295" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">#2 line 864 swap_next: <tspan fill="#1a7f37" font-weight="600">admitted</tspan> <tspan fill="#59636e">(tests pass on the code as it is, fail on the fault)</tspan></text>
<text x="20" y="330" fill="#1f2328" xml:space="preserve" font-weight="600">before</text>
<text x="430" y="330" fill="#59636e" xml:space="preserve" text-anchor="end">the list is set up inside a branch; two ways out</text>
<rect x="20" y="338" width="410" height="310" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="21" y="349" width="408" height="80" fill="#ffebe9"/>
<rect x="21" y="525" width="408" height="64" fill="#ffebe9"/>
<text x="32" y="362" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">let mut reasons = if arm_exit == 0 {</text>
<text x="32" y="378" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    Vec::new()</text>
<text x="32" y="394" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">} else {</text>
<text x="32" y="410" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    vec![format!(&quot;arm exit {arm_exit}&quot;)]</text>
<text x="32" y="426" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">};</text>
<text x="32" y="442" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">if !fresh {</text>
<text x="32" y="458" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    reasons.push(&quot;replay not fresh&quot;.into());</text>
<text x="32" y="474" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">}</text>
<text x="32" y="490" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">if level2_ops &gt; 0 &amp;&amp; !has_evidence {</text>
<text x="32" y="506" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    reasons.push(format!(&quot;{level2_ops} L2 diffs&quot;));</text>
<text x="32" y="522" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">}</text>
<text x="32" y="538" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">if reasons.is_empty() {</text>
<text x="32" y="554" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    return (0, reasons);</text>
<text x="32" y="570" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">}</text>
<text x="32" y="586" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">(if arm_exit == 2 { 2 } else { 1 }, reasons)</text>
<text x="450" y="330" fill="#1f2328" xml:space="preserve" font-weight="600">after</text>
<text x="860" y="330" fill="#59636e" xml:space="preserve" text-anchor="end">set up once, checks in a row, one way out</text>
<rect x="450" y="338" width="410" height="310" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="451" y="349" width="408" height="64" fill="#dafbe1"/>
<rect x="451" y="509" width="408" height="128" fill="#dafbe1"/>
<text x="462" y="362" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">let mut reasons = Vec::new();</text>
<text x="462" y="378" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">if arm_exit != 0 {</text>
<text x="462" y="394" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    reasons.push(format!(&quot;arm exit {arm_exit}&quot;));</text>
<text x="462" y="410" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">}</text>
<text x="462" y="426" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">if !fresh {</text>
<text x="462" y="442" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    reasons.push(&quot;replay not fresh&quot;.into());</text>
<text x="462" y="458" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">}</text>
<text x="462" y="474" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">if level2_ops &gt; 0 &amp;&amp; !has_evidence {</text>
<text x="462" y="490" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    reasons.push(format!(&quot;{level2_ops} L2 diffs&quot;));</text>
<text x="462" y="506" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">}</text>
<text x="462" y="522" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">let code = if reasons.is_empty() {</text>
<text x="462" y="538" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    0</text>
<text x="462" y="554" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">} else if arm_exit == 2 {</text>
<text x="462" y="570" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    2</text>
<text x="462" y="586" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">} else {</text>
<text x="462" y="602" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">    1</text>
<text x="462" y="618" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">};</text>
<text x="462" y="634" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">(code, reasons)</text>
<text x="20" y="666" fill="#59636e" xml:space="preserve" >verdict() in native/src/recording.rs, strings shortened. Same result on 480 input combinations. More lines, one token fewer: clearer, not shorter.</text>
<circle cx="32" cy="706" r="13" fill="#1f2328"/>
<text x="32" y="711" fill="#ffffff" xml:space="preserve" font-weight="600" font-size="13" text-anchor="middle">3</text>
<text x="54" y="704" fill="#1f2328" xml:space="preserve" font-weight="600" font-size="15">One answer on the branch, enforced when you push</text>
<text x="54" y="721" fill="#59636e" xml:space="preserve" >Your tests must pass before and after, and must not notice fewer faults in what you touched.</text>
