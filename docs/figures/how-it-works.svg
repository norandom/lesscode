<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1070" width="880" height="1070" font-family="Helvetica, Arial, sans-serif" font-size="11" role="img">
<title>Figure 1. (a) Control-flow graph of one function before and after a candidate step. (b) A model proposes rewrites inside fixed constraints; mechanical checks decide. (c) Each step is a Git branch judged by the project's tests and by planted faults.</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#000"/></marker>
</defs>
<rect width="880" height="1070" fill="#fff"/>

<!-- ======================= (a) control-flow graphs ======================= -->
<g fill="#000">
  <text x="220" y="30" text-anchor="middle" font-weight="bold">before</text>
  <text x="660" y="30" text-anchor="middle" font-weight="bold">after (candidate step)</text>
</g>
<line x1="440" y1="20" x2="440" y2="585" stroke="#999" stroke-dasharray="2 3"/>

<!-- before: nodes -->
<g fill="#fff" stroke="#000" stroke-width="1">
  <circle cx="220" cy="54" r="5" fill="#000"/>
  <polygon points="220,82 290,100 220,118 150,100"/>
  <rect x="50" y="138" width="120" height="24"/>
  <rect x="255" y="138" width="150" height="24"/>
  <polygon points="220,202 290,220 220,238 150,220"/>
  <rect x="265" y="250" width="130" height="24"/>
  <polygon points="220,312 315,330 220,348 125,330"/>
  <rect x="275" y="360" width="130" height="24"/>
  <polygon points="220,422 290,440 220,458 150,440"/>
  <rect x="25" y="490" width="150" height="24"/>
  <rect x="215" y="490" width="215" height="24"/>
  <circle cx="100" cy="546" r="8"/><circle cx="100" cy="546" r="4.5" fill="#000"/>
  <circle cx="322" cy="546" r="8"/><circle cx="322" cy="546" r="4.5" fill="#000"/>
</g>
<g fill="#000" text-anchor="middle">
  <text x="220" y="104">arm_exit = 0</text>
  <text x="110" y="154">reasons ← [ ]</text>
  <text x="330" y="154">reasons ← [exit n]</text>
  <text x="220" y="224">fresh</text>
  <text x="330" y="266">reasons.push(stale)</text>
  <text x="220" y="334">L2 diffs without evidence</text>
  <text x="340" y="376">reasons.push(diffs)</text>
  <text x="220" y="444">reasons = [ ]</text>
  <text x="100" y="506">return (0, reasons)</text>
  <text x="322" y="506">return (arm_exit = 2 ? 2 : 1, reasons)</text>
</g>
<!-- before: edges -->
<g fill="none" stroke="#000" stroke-width="1" marker-end="url(#arrow)">
  <path d="M220,59 V82"/>
  <path d="M150,100 H110 V138"/>
  <path d="M290,100 H330 V138"/>
  <path d="M110,162 V184 H220 V202"/>
  <path d="M290,220 H330 V250"/>
  <path d="M220,238 V312"/>
  <path d="M315,330 H340 V360"/>
  <path d="M220,348 V422"/>
  <path d="M150,440 H100 V490"/>
  <path d="M290,440 H322 V490"/>
  <path d="M100,514 V538"/>
  <path d="M322,514 V538"/>
</g>
<g fill="none" stroke="#000" stroke-width="1">
  <path d="M330,162 V184 H220"/>
  <path d="M330,274 V294 H220"/>
  <path d="M340,384 V404 H220"/>
</g>
<g fill="#000" font-style="italic" font-size="10">
  <text x="128" y="95">T</text><text x="304" y="95">F</text>
  <text x="304" y="215">F</text><text x="226" y="254">T</text>
  <text x="322" y="325">T</text><text x="226" y="364">F</text>
  <text x="128" y="435">T</text><text x="304" y="435">F</text>
</g>

<!-- after: nodes -->
<g fill="#fff" stroke="#000" stroke-width="1">
  <circle cx="660" cy="54" r="5" fill="#000"/>
  <rect x="600" y="78" width="120" height="24"/>
  <polygon points="660,124 730,142 660,160 590,142"/>
  <rect x="725" y="172" width="130" height="24"/>
  <polygon points="660,222 730,240 660,258 590,240"/>
  <rect x="725" y="270" width="130" height="24"/>
  <polygon points="660,320 755,338 660,356 565,338"/>
  <rect x="725" y="368" width="130" height="24"/>
  <rect x="525" y="428" width="270" height="24"/>
  <rect x="575" y="474" width="170" height="24"/>
  <circle cx="660" cy="530" r="8"/><circle cx="660" cy="530" r="4.5" fill="#000"/>
</g>
<g fill="#000" text-anchor="middle">
  <text x="660" y="94">reasons ← [ ]</text>
  <text x="660" y="146">arm_exit ≠ 0</text>
  <text x="790" y="188">reasons.push(exit n)</text>
  <text x="660" y="244">¬ fresh</text>
  <text x="790" y="286">reasons.push(stale)</text>
  <text x="660" y="342">L2 diffs without evidence</text>
  <text x="790" y="384">reasons.push(diffs)</text>
  <text x="660" y="444">code ← reasons = [ ] ? 0 : (arm_exit = 2 ? 2 : 1)</text>
  <text x="660" y="490">return (code, reasons)</text>
</g>
<!-- after: edges -->
<g fill="none" stroke="#000" stroke-width="1" marker-end="url(#arrow)">
  <path d="M660,59 V78"/>
  <path d="M660,102 V124"/>
  <path d="M730,142 H790 V172"/>
  <path d="M660,160 V222"/>
  <path d="M730,240 H790 V270"/>
  <path d="M660,258 V320"/>
  <path d="M755,338 H790 V368"/>
  <path d="M660,356 V428"/>
  <path d="M660,452 V474"/>
  <path d="M660,498 V522"/>
</g>
<g fill="none" stroke="#000" stroke-width="1">
  <path d="M790,196 V208 H660"/>
  <path d="M790,294 V306 H660"/>
  <path d="M790,392 V404 H660"/>
</g>
<g fill="#000" font-style="italic" font-size="10">
  <text x="742" y="137">T</text><text x="666" y="176">F</text>
  <text x="742" y="235">T</text><text x="666" y="274">F</text>
  <text x="766" y="333">T</text><text x="666" y="372">F</text>
</g>

<!-- metrics -->
<g fill="#000" text-anchor="middle" font-size="10.5">
  <text x="220" y="578">5 decisions · reasons defined on 2 paths · 2 exit points</text>
  <text x="660" y="578">5 decisions · reasons defined once · 1 exit point</text>
</g>
<g font-family="Times New Roman, Times, serif" font-size="13" fill="#000" text-anchor="middle">
  <text x="440" y="612"><tspan font-weight="bold">(a)</tspan> Control-flow graph of <tspan font-family="Courier New, monospace" font-size="12">verdict()</tspan> in <tspan font-family="Courier New, monospace" font-size="12">native/src/recording.rs</tspan>, before and after one candidate step.</text>
  <text x="440" y="630">Both versions return the same result on 480 input combinations; the step changes structure, not behaviour.</text>
</g>

<!-- ======================= (b) proposal loop ======================= -->
<g fill="#fff" stroke="#000" stroke-width="1">
  <rect x="30" y="668" width="190" height="62"/>
  <rect x="275" y="668" width="200" height="62"/>
  <rect x="530" y="668" width="200" height="62"/>
</g>
<g fill="#000" text-anchor="middle">
  <text x="125" y="688" font-weight="bold">Scope and constraints</text>
  <text x="125" y="705" font-size="10">public surface, declared state</text>
  <text x="125" y="718" font-size="10">frame, token budget</text>
  <text x="375" y="688" font-weight="bold">LLM proposer</text>
  <text x="375" y="705" font-size="10">prompt tuned by search</text>
  <text x="375" y="718" font-size="10">(GEPA, MIPROv2)</text>
  <text x="630" y="688" font-weight="bold">Mechanical barrier</text>
  <text x="630" y="705" font-size="10">parses and builds; stays inside</text>
  <text x="630" y="718" font-size="10">the declared frame and surface</text>
  <text x="248" y="692" font-size="10">prompt</text>
  <text x="502" y="692" font-size="10">rewrite</text>
  <text x="806" y="692" font-size="10">candidate</text>
  <text x="502" y="766" font-size="10">score</text>
  <text x="700" y="772" font-size="10" text-anchor="start">rejected: discarded</text>
</g>
<g fill="none" stroke="#000" stroke-width="1" marker-end="url(#arrow)">
  <path d="M220,699 H275"/>
  <path d="M475,699 H530"/>
  <path d="M730,699 H850"/>
  <path d="M680,730 V768 H696" />
  <path d="M580,730 V754 H375 V730" stroke-dasharray="4 3"/>
</g>
<g font-family="Times New Roman, Times, serif" font-size="13" fill="#000" text-anchor="middle">
  <text x="440" y="804"><tspan font-weight="bold">(b)</tspan> A model proposes rewrites of one scope. Only rewrites that pass the mechanical checks leave the loop;</text>
  <text x="440" y="822">the checks also score the prompt search, so the model's own account of a rewrite is never the criterion.</text>
</g>

<!-- ======================= (c) step on a branch ======================= -->
<g fill="none" stroke="#000" stroke-width="1.2">
  <path d="M50,880 H830"/>
  <path d="M200,880 C235,880 235,940 270,940 H650 C685,940 685,880 720,880"/>
</g>
<g fill="#000" stroke="#000" stroke-width="1.2">
  <circle cx="100" cy="880" r="5"/>
  <circle cx="200" cy="880" r="5"/>
  <circle cx="330" cy="940" r="5"/>
  <circle cx="450" cy="940" r="5"/>
  <circle cx="720" cy="880" r="5.5" fill="#fff" stroke-dasharray="2 2"/>
</g>
<rect x="545" y="928" width="76" height="24" fill="#fff" stroke="#000"/>
<g fill="#000" text-anchor="middle">
  <text x="583" y="944" font-weight="bold">step check</text>
  <text x="62" y="868" font-family="Courier New, monospace">main</text>
  <text x="200" y="868" font-size="10">base</text>
  <text x="720" y="868" font-size="10">merge, if accepted</text>
  <text x="330" y="926" font-size="10">pins</text>
  <text x="450" y="926" font-size="10">change</text>
  <text x="330" y="962" font-size="10">tests that fix what</text>
  <text x="330" y="975" font-size="10">the code does today</text>
  <text x="450" y="962" font-size="10">the simpler</text>
  <text x="450" y="975" font-size="10">version</text>
</g>
<text x="262" y="906" font-family="Courier New, monospace" font-size="10.5" fill="#000">step/verdict-one-exit</text>
<g fill="#000" font-size="10">
  <text x="545" y="968">1. tests pass on base and on step</text>
  <text x="545" y="981">2. planted faults noticed, per function:</text>
  <text x="557" y="994">not fewer after than before</text>
  <text x="545" y="1007">3. size within the declared budget</text>
</g>
<g font-family="Times New Roman, Times, serif" font-size="13" fill="#000" text-anchor="middle">
  <text x="440" y="1036"><tspan font-weight="bold">(c)</tspan> Each step is one branch: pins first, then the change. A guard accepts the branch by exit code only if a</text>
  <text x="440" y="1054">verdict exists for exactly this revision; the step's specification is audited separately (openidea-kiro).</text>
</g>
</svg>
