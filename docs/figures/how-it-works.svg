<circle cx="344" cy="766" r="5.5" fill="#ffffff" stroke="#59636e" stroke-width="2" stroke-dasharray="2 2"/>
<text x="30" y="752" fill="#59636e" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11">main</text>
<text x="344" y="752" fill="#59636e" xml:space="preserve" font-size="11" text-anchor="middle">merge</text>
<text x="140" y="800" fill="#59636e" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5">step/one-exit</text>
<text x="170" y="830" fill="#1f2328" xml:space="preserve" font-size="11" text-anchor="middle">pins</text>
<text x="250" y="830" fill="#1f2328" xml:space="preserve" font-size="11" text-anchor="middle">change</text>
<text x="210" y="848" fill="#59636e" xml:space="preserve" font-size="11" text-anchor="middle">two commits, in this order</text>
<rect x="424" y="740" width="436" height="126" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="438" y="762" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5"><tspan fill="#59636e">$</tspan> lesscode-core step check --declaration step.json ...</text>
<text x="438" y="780" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">step one-exit: <tspan fill="#1a7f37" font-weight="600">accepted</tspan></text>
<text x="438" y="804" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5"><tspan fill="#59636e">$</tspan> git push</text>
<text x="438" y="822" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">step/one-exit: <tspan fill="#1a7f37" font-weight="600">accepted</tspan></text>
<text x="438" y="842" fill="#59636e" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">or, when the code was changed after the check:</text>
<text x="438" y="858" fill="#1f2328" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">step/one-exit: <tspan fill="#cf222e" font-weight="600">refused</tspan></text>
<text x="20" y="890" fill="#59636e" xml:space="preserve" >Output shortened. The step's spec is kept consistent by openidea-kiro; lesscode checks the code and the tests.</text>
